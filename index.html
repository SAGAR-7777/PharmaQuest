<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PHARMAQUEST — Digital Pharmacy Lab for D.Pharm students. ER-2020 syllabus grounded PYQs, practical experiment notebooks, viva voce examination simulator, and intelligent daily dose practice." />
  <meta name="keywords" content="D.Pharm, ER-2020, Pharmacy, Pharmaceutics, Pharmaceutical Chemistry, Pharmacognosy, Human Anatomy, Social Pharmacy, PCI, PYQs" />
  <title>PHARMAQUEST — D.Pharm Digital Pharmacy Lab (ER-2020)</title>

  <!-- PHARMAQUEST Backend API Configuration (Production Render Backend: https://pharmaquest.onrender.com) -->
  <script>
    // Configured in js/config.js to automatically target https://pharmaquest.onrender.com on Vercel
    // and relative /api routes on localhost/127.0.0.1.
    // Optional explicit override: window.__PHARMAQUEST_API_URL__ = 'https://pharmaquest.onrender.com';
  </script>

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/modules.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
  <!-- Atmospheric Ambient Background Light -->
  <div class="ambient-glow"></div>

  <!-- Main Sticky Header -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- Brand Logo -->
      <a href="#" class="brand-logo" data-view="landing">
        <div class="logo-symbol">⚚</div>
        <div>
          <span>PHARMA<strong style="color: var(--accent-cyan);">QUEST</strong></span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="nav-links" aria-label="Main Navigation">
        <a href="#" class="nav-link active" data-view="landing">Hub</a>
        <a href="#" class="nav-link" data-view="dashboard">Mission</a>
        <a href="#" class="nav-link" data-view="subject" data-subject="pharmaceutics">Syllabus</a>
        <a href="#" class="nav-link" data-view="pyq">PYQs</a>
        <a href="#" class="nav-link" data-view="radar">Radar</a>
        <a href="#" class="nav-link" data-view="exam">Mock Exam</a>
        <a href="#" class="nav-link" data-view="viva">Viva Lab</a>
        <a href="#" class="nav-link" data-view="practicals">Practicals</a>
        <a href="#" class="nav-link" data-view="notes">Vault</a>
        <a href="#" class="nav-link" data-view="ai">Pharma AI</a>
        <a href="#" class="nav-link" data-view="admin" style="color: var(--text-muted); font-size: 0.78rem;">Admin</a>
      </nav>

      <!-- Header Actions (Dynamic Auth State) -->
      <div class="header-actions" id="header-user-slot">
        <button class="btn btn-secondary" id="btn-header-signin" style="padding: 7px 14px; font-size: 0.82rem;">
          SIGN IN
        </button>
        <button class="btn btn-primary" id="btn-header-join" style="padding: 7px 16px; font-size: 0.82rem;">
          JOIN LAB
        </button>
      </div>
    </div>
  </header>

  <!-- Dynamic Application Root -->
  <main id="app-root" role="main"></main>

  <!-- Mobile Bottom Navigation Bar (Visible on touch & small viewports) -->
  <nav class="mobile-bottom-bar" aria-label="Mobile Bottom Navigation">
    <a href="#" class="mobile-nav-item active" data-view="landing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Hub</span>
    </a>
    <a href="#" class="mobile-nav-item" data-view="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Mission</span>
    </a>
    <a href="#" class="mobile-nav-item" data-view="practice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <span>Practice</span>
    </a>
    <a href="#" class="mobile-nav-item" data-view="pyq">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>PYQs</span>
    </a>
    <a href="#" class="mobile-nav-item" data-view="ai">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg>
      <span>AI Desk</span>
    </a>
  </nav>

  <!-- ES6 Modular Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
